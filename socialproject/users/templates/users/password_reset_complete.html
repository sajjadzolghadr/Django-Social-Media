{% extends "users/base.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow text-center">
                <div class="card-header bg-success text-white"><h4 class="mb-0">Password Reset Complete</h4></div>
                <div class="card-body">
                    <h5 class="text-success mb-3">Your password has been reset successfully.</h5>
                    <p class="text-muted">You can now log in using your new password.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
